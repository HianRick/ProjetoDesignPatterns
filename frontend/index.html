<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca - Livros e Empréstimos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Biblioteca</h1>
        <p>Exemplo de consumo da API (livros, empréstimos e a EmprestimoFactory)</p>
    </header>

    <nav class="tabs">
        <button class="tab-btn active" data-tab="livros">Livros</button>
        <button class="tab-btn" data-tab="emprestimos">Empréstimos</button>
    </nav>

    <main>
        <!-- ===================== ABA LIVROS ===================== -->
        <div id="tab-livros" class="tab-panel">
            <section class="card">
                <h2 id="form-titulo">Novo livro</h2>
                <form id="livro-form">
                    <input type="hidden" id="livro-id">

                    <label>
                        Nome
                        <input type="text" id="nome" required>
                    </label>
                    <label>
                        Autor
                        <input type="text" id="autor">
                    </label>
                    <label>
                        Descrição
                        <textarea id="descricao" rows="2"></textarea>
                    </label>
                    <label>
                        Código ISBN (máx. 13)
                        <input type="text" id="codigoISBN" maxlength="13">
                    </label>
                    <label class="checkbox">
                        <input type="checkbox" id="disponibilidade" checked>
                        Disponível
                    </label>

                    <div class="actions">
                        <button type="submit" id="btn-salvar">Adicionar</button>
                        <button type="button" id="btn-cancelar" class="secondary" hidden>Cancelar</button>
                    </div>
                </form>
                <p id="msg" class="msg"></p>
            </section>

            <section class="card">
                <div class="lista-header">
                    <h2>Livros cadastrados</h2>
                    <button type="button" id="btn-recarregar" class="secondary">Recarregar</button>
                </div>
                <div id="lista"></div>
            </section>
        </div>

        <!-- ===================== ABA EMPRÉSTIMOS ===================== -->
        <div id="tab-emprestimos" class="tab-panel" hidden>
            <section class="card">
                <h2>Novo empréstimo</h2>
                <form id="emprestimo-form">
                    <input type="hidden" id="emp-livro">
                    <input type="hidden" id="emp-leitor">

                    <label>
                        Livro (apenas disponíveis)
                        <div class="picker">
                            <span id="emp-livro-label" class="picker-valor vazio">Nenhum livro selecionado</span>
                            <button type="button" id="btn-pick-livro" class="secondary">Selecionar livro</button>
                        </div>
                    </label>

                    <label>
                        Leitor
                        <div class="picker">
                            <span id="emp-leitor-label" class="picker-valor vazio">Nenhum leitor selecionado</span>
                            <button type="button" id="btn-pick-leitor" class="secondary">Selecionar leitor</button>
                        </div>
                    </label>

                    <label>
                        Data do empréstimo
                        <input type="date" id="emp-data-emprestimo" required>
                    </label>

                    <label>
                        Data de devolução <span class="opcional">(opcional)</span>
                        <input type="date" id="emp-data-devolucao">
                    </label>
                    <p class="dica">
                        Deixe a devolução <strong>em branco</strong> para a
                        <code>EmprestimoFactory</code> aplicar o prazo padrão de <strong>15 dias</strong>.
                    </p>

                    <div class="actions">
                        <button type="submit">Realizar empréstimo</button>
                    </div>
                </form>
                <p id="emp-msg" class="msg"></p>
                <div id="emp-resultado"></div>
            </section>

            <section class="card">
                <div class="lista-header">
                    <h2>Empréstimos</h2>
                    <button type="button" id="btn-recarregar-emp" class="secondary">Recarregar</button>
                </div>
                <div id="emp-lista"></div>
            </section>
        </div>
    </main>

    <!-- ===================== MODAL: BUSCAR LIVRO ===================== -->
    <div class="modal-overlay" id="modal-livro" hidden>
        <div class="modal" role="dialog" aria-modal="true">
            <div class="modal-header">
                <h3>Selecionar livro</h3>
                <button type="button" class="modal-close" data-close="modal-livro">&times;</button>
            </div>
            <input type="text" id="busca-livro" placeholder="Pesquisar por nome ou autor...">
            <div class="modal-lista" id="modal-livro-lista"></div>
        </div>
    </div>

    <!-- ===================== MODAL: BUSCAR / CADASTRAR LEITOR ===================== -->
    <div class="modal-overlay" id="modal-leitor" hidden>
        <div class="modal" role="dialog" aria-modal="true">
            <div class="modal-header">
                <h3>Selecionar leitor</h3>
                <button type="button" class="modal-close" data-close="modal-leitor">&times;</button>
            </div>
            <input type="text" id="busca-leitor" placeholder="Pesquisar por nome...">
            <div class="modal-lista" id="modal-leitor-lista"></div>

            <div class="modal-quick-add">
                <strong>Adicionar leitor rápido</strong>
                <div class="quick-add-fields">
                    <input type="text" id="novo-leitor-nome" placeholder="Nome do leitor">
                    <input type="text" id="novo-leitor-contato" placeholder="Contato">
                    <button type="button" id="btn-add-leitor">Salvar e selecionar</button>
                </div>
                <p id="modal-leitor-msg" class="msg"></p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
